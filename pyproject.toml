[project]
name = "zotero-rag"
version = "0.1.0"
description = "Serwer MCP: wyszukiwanie semantyczne w bibliotece Zotero (PL/EN) dla Claude"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=2.3,<3",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[project.scripts]
zotero-rag = "zotero_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zotero_rag"]
